name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exo2-portail-depot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: exo2-portail-depot/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exo2-portail-depot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: exo2-portail-depot/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
