server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Deposits are up to 20 Mo (see MAX_FILE_SIZE_MB) plus multipart overhead.
  client_max_body_size 25m;

  # API routes are proxied to the backend by container name on the docker
  # network - same origin as the SPA, so no CORS dance in production.
  location /auth/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /requests {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /public/ {
    proxy_pass http://backend:3000;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;
  }

  # NOTE: /metrics is intentionally NOT exposed here - Prometheus scrapes
  # the backend directly over the docker network (see infra/prometheus.yml).

  # SPA fallback: client-side routing (react-router) owns everything else.
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
