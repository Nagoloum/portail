server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Deposits are up to 20 Mo (see MAX_FILE_SIZE_MB) plus multipart overhead.
  client_max_body_size 25m;

  # --- Security headers on everything this server answers ---------------
  # `always` matters: without it nginx drops the header on error responses
  # (4xx/5xx), which are exactly the pages an attacker tries to abuse.
  #
  # The CSP is written against what the app actually loads:
  #  - script-src 'self'          the Vite bundle, nothing remote, no eval;
  #  - style-src  'unsafe-inline' Emotion (Chakra's engine) injects style
  #                               tags at runtime, and index.html carries an
  #                               inline <style> - a nonce would need the
  #                               HTML to be templated per request, which a
  #                               static SPA build is not;
  #  - fonts.googleapis/gstatic   the Inter variable font (see index.html);
  #  - connect-src 'self'         the API is same-origin behind this nginx;
  #  - frame-ancestors 'none'     no clickjacking a PIN entry form.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # A deposit link carries a token in its path: keep it out of any
  # device-API grant a third-party frame could ask for.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # API routes are proxied to the backend by container name on the docker
  # network - same origin as the SPA, so no CORS dance in production.
  location /auth/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /requests {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /public/ {
    proxy_pass http://backend:3000;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;
  }

  # NOTE: /metrics is intentionally NOT exposed here - Prometheus scrapes
  # the backend directly over the docker network (see infra/prometheus.yml).
  # It therefore falls through to the SPA fallback below, like any other
  # unknown path, instead of reaching the backend.

  # SPA fallback: client-side routing (react-router) owns everything else.
  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
    try_files $uri =404;
    # A `location` block starts its own header set: repeating the security
    # headers here is required, an add_header in the server block is NOT
    # inherited once a location declares one of its own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
