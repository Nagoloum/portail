global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Scraped directly over the docker network - never through nginx, so
  # /metrics is not part of the public attack surface (see README).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
