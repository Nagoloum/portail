route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # No outbound channel is wired here on purpose: this exercise gives no
  # real SMTP/Slack credentials to send to, and faking one would be worse
  # than not having it. Alerts still fire, are visible in Alertmanager's
  # UI/API (http://localhost:${ALERTMANAGER_PORT}) and in Grafana's
  # "Alerting" view, and evaluation is exactly what it would be in
  # production. Wiring a real channel is additive, e.g.:
  #
  # - name: default
  #   slack_configs:
  #     - api_url: '${SLACK_WEBHOOK_URL}'
  #       channel: '#alerts'
  - name: default
